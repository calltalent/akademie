# Deploy nach Cloudflare Workers. Ab hier ist `main` per Definition der
# Stand, der laeuft. Der Drift zwischen Repo und Produktion (main vom
# 24.08., Worker vom 08.09.) war der teuerste Zustand des Projekts.
#
# CLAUDE.md §4.6 verlangt fuer jeden Deploy Josips ausdrueckliche Freigabe.
# Deshalb haengt der Job an der GitHub-Umgebung `production`: traegt Josip
# dort unter "Required reviewers" sich selbst ein, wartet jeder Lauf auf
# seinen Klick. Die Freigabe bleibt, die Handarbeit entfaellt.
name: Deploy

on:
  push:
    branches: [main]
    # Ein Commit, der ausschliesslich Dokumentation aendert, braucht keinen
    # Deploy und soll Josip keine Freigabe abverlangen. `paths-ignore` greift
    # nur, wenn ALLE geaenderten Dateien passen; sobald Code dabei ist, laeuft
    # der Workflow normal. `ci.yml` prueft weiterhin jeden Push.
    paths-ignore:
      - "**.md"
      - "PRIPREMA/**"
      - "ZAKONI/**"
  workflow_dispatch:

# Zwei gleichzeitige Deploys wuerden sich gegenseitig ueberschreiben.
# cancel-in-progress bleibt aus: ein laufender Deploy wird zu Ende gefahren.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build und Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://academy.calltalent.ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # NEXT_PUBLIC_*-Werte werden beim Build fest ins Client-Bundle
      # geschrieben. Fehlt einer, deployt der Lauf trotzdem, nur mit den
      # Dev-Standardwerten aus src/lib/env.ts. Konkret hiesse das:
      # `portal.localhost` statt `portal.calltalent.ai`, das Betreiber-Portal
      # waere in Produktion nicht erreichbar, und niemand wuerde es am
      # gruenen Haken sehen. Deshalb bricht der Lauf hier ab.
      - name: Pflichtvariablen pruefen
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PORTAL_HOST: ${{ vars.NEXT_PUBLIC_PORTAL_HOST }}
          NEXT_PUBLIC_MARKETPLACE_HOST: ${{ vars.NEXT_PUBLIC_MARKETPLACE_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          fehlt=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                      NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_PORTAL_HOST \
                      NEXT_PUBLIC_MARKETPLACE_HOST CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then fehlt="$fehlt $name"; fi
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Deploy abgebrochen. Nicht gesetzt:$fehlt"
            echo "Variablen unter Settings -> Secrets and variables -> Actions eintragen."
            exit 1
          fi
          echo "Alle Pflichtvariablen gesetzt."

          # Der Waechter prueft NUR, ob der Wert ueberhaupt ein Token sein KANN:
          # kein Leerraum, keine Anfuehrungszeichen, mindestens 20 Zeichen. Ob
          # ein Token echt ist und die noetigen Rechte hat, weiss allein
          # Cloudflare, und dessen Antworten sind eindeutig lesbar
          # ("Authentication failed" code 9106, "Authentication error"
          # code 10000). Ein Tor, das gueltige Werte abweist, ist schlimmer als
          # eines, das eine Sekunde spaeter am richtigen Ort scheitert.
          #
          # Die Regeln stammen aus fuenf gescheiterten Laeufen am 09.09.2026:
          #   Lauf 5: Zeilenumbruch im Secret -> `Headers.set: "..." is an
          #           invalid header value`, erst nach drei Minuten Build.
          #   Lauf 6: alles an Leerraum zu entfernen klebte die Bruchstuecke
          #           zusammen und verschleierte die Diagnose. Deshalb wird
          #           heute nur AUSSEN getrimmt.
          #   Lauf 7: 145 Zeichen, die curl-Beispielzeile aus dem Dashboard.
          #   Lauf 8: 53 saubere Zeichen wurden abgewiesen, weil hier "genau 40"
          #           stand. Diese Zahl war eine Annahme ueber Cloudflares
          #           Format und ist zurueckgenommen.
          #
          # Getrimmt wird per Bash-Parametererweiterung, nicht per sed oder
          # grep: beide arbeiten ZEILENWEISE, ein mehrzeiliger Wert haette die
          # Pruefung bestanden, sobald irgendeine Zeile passt. `case` unten
          # vergleicht dagegen die ganze Zeichenkette, auch ueber Zeilen hinweg.
          sauber="${CLOUDFLARE_API_TOKEN#"${CLOUDFLARE_API_TOKEN%%[![:space:]]*}"}"
          sauber="${sauber%"${sauber##*[![:space:]]}"}"
          if [ "$sauber" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Leerraum am Anfang oder Ende von CLOUDFLARE_API_TOKEN entfernt."
          fi
          gueltig() {
            case "$1" in
              *[!A-Za-z0-9_-]*) return 1 ;;
            esac
            [ "${#1}" -ge 20 ]
          }

          # Steht im Secret mehr als der Token (Lauf 7: die curl-Beispielzeile,
          # deren Kopier-Knopf direkt unter dem des Tokens sitzt), wird der
          # Token herausgezogen: an jedem Zeichen ausserhalb des Alphabets
          # trennen, Teilstuecke ab 20 Zeichen einsammeln. Nur wenn dabei GENAU
          # EIN eindeutiger Kandidat bleibt, wird er benutzt. Bei mehreren waere
          # die Wahl geraten, und Raten ist hier falsch.
          if ! gueltig "$sauber"; then
            kandidaten=$(printf '%s' "$sauber" | tr -c 'A-Za-z0-9_-' '\n' | awk 'length($0)>=20' | sort -u)
            anzahl=$(printf '%s' "$kandidaten" | grep -c . || true)
            if [ "$anzahl" -eq 1 ]; then
              sauber="$kandidaten"
              echo "::warning::CLOUDFLARE_API_TOKEN enthielt zusaetzlichen Text (${#CLOUDFLARE_API_TOKEN} Zeichen). Der Token wurde eindeutig herausgeloest und dieser Lauf benutzt ihn. Trage das Secret trotzdem sauber neu ein: im Cloudflare-Dashboard den Kopier-Knopf AM TOKEN nehmen, nicht den an der curl-Beispielzeile darunter."
            fi
          fi

          if ! gueltig "$sauber"; then
            # Die beiden Fehlerarten getrennt melden, damit die naechste Runde
            # nicht wieder raten muss.
            fremdzeichen="nein"
            case "$sauber" in
              *[!A-Za-z0-9_-]*) fremdzeichen="ja" ;;
            esac
            echo "::error::CLOUDFLARE_API_TOKEN ist kein brauchbarer Token. Laenge: ${#sauber}. Zeichen ausserhalb von A-Z a-z 0-9 _ - enthalten: ${fremdzeichen}."
            if [ "$fremdzeichen" = "ja" ]; then
              echo "Im Wert steht mehr als der Token, etwa eine Beschriftung, eine zweite Zeile oder die curl-Beispielzeile."
              echo "Im Cloudflare-Dashboard den Kopier-Knopf AM TOKEN nehmen, nicht den an der curl-Zeile darunter."
            else
              echo "Der Wert besteht aus zulaessigen Zeichen, ist aber zu kurz (unter 20)."
            fi
            echo "Neu erzeugen unter https://dash.cloudflare.com/profile/api-tokens, Vorlage 'Edit Cloudflare Workers'."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$sauber" >> "$GITHUB_ENV"
          echo "Token-Form plausibel (${#sauber} Zeichen)."

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Dieselben Pruefungen wie in ci.yml. Der Push auf main kam vielleicht
      # aus einem Merge, dessen Ergebnis so nie getestet wurde.
      - name: TypeScript, Lint und Tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-platzhalter.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-platzhalter-kein-echter-schluessel
        run: |
          npx tsc --noEmit
          npm run lint
          npm run test

      # `opennextjs-cloudflare build && opennextjs-cloudflare deploy`.
      # account_id und routes stehen in wrangler.jsonc, `keep_vars: true`
      # dort schuetzt die im Dashboard gesetzten Secrets vor dem Deploy.
      - name: Bauen und ausliefern
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PORTAL_HOST: ${{ vars.NEXT_PUBLIC_PORTAL_HOST }}
          NEXT_PUBLIC_MARKETPLACE_HOST: ${{ vars.NEXT_PUBLIC_MARKETPLACE_HOST }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # CLOUDFLARE_API_TOKEN steht hier bewusst NICHT: der Wächterschritt
          # legt den bereinigten Wert in GITHUB_ENV ab. Ein `env:` auf
          # Schrittebene hätte Vorrang und würde die Bereinigung aufheben.
        run: npm run deploy

      - name: Ergebnis
        run: echo "Deployt aus ${{ github.sha }} auf https://academy.calltalent.ai"
