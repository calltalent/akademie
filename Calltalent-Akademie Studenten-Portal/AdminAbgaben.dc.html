<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>* { box-sizing: border-box; } body { margin: 0; } a { color:#5663AE; } a:hover { color:#3E3F66; }</style>
</helmet>
<div style="display:flex; min-height:100vh; font-family:'Montserrat',system-ui,sans-serif; background:#F4F5FA; color:#1A1A2E; font-size:18px; line-height:1.6;">
  <dc-import name="AdminSidebar" active="submissions" hint-size="264px,100vh"></dc-import>
  <div style="flex:1 1 auto; display:flex; flex-direction:column; min-width:0;">
    <header style="display:flex; align-items:center; gap:18px; padding:20px 40px;">
      <div style="flex:1 1 auto;">
        <div style="font-size:13px; font-weight:600; color:#A9AAC4;">Inhalte · Abgaben</div>
        <h1 style="margin:2px 0 0; font-size:26px; font-weight:800; letter-spacing:-.01em;">Abgaben</h1>
      </div>
      <span style="display:inline-flex; align-items:center; gap:8px; background:#F7EED4; color:#1A1A2E; font-weight:700; font-size:14px; padding:9px 15px; border-radius:10px;">8 offen · 3 überfällig</span>
    </header>
    <main style="flex:1 1 auto; padding:16px 40px 56px;">
      <div style="display:flex; flex-direction:column; gap:14px; max-width:900px;">
        <sc-for list="{{ items }}" as="s" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; gap:18px; background:#fff; border:1px solid #E7E8F2; border-radius:14px; padding:18px 22px;">
            <span style="flex:0 0 auto; width:44px; height:44px; border-radius:11px; background:#3E3F66; color:#F7EED4; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;">{{ s.initials }}</span>
            <div style="flex:1 1 auto; min-width:0;">
              <div style="font-size:16px; font-weight:700;">{{ s.name }}</div>
              <div style="font-size:14px; color:#66679B;">{{ s.task }} · {{ s.course }}</div>
            </div>
            <span style="flex:0 0 auto; font-size:13px; color:#A9AAC4;">{{ s.time }}</span>
            <span style="{{ s.statusStyle }}">{{ s.status }}</span>
            <a href="#" style="flex:0 0 auto; display:inline-flex; padding:10px 18px; border-radius:10px; background:#5663AE; color:#fff; font-size:14px; font-weight:700; text-decoration:none;">Bewerten</a>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:720}}">
class Component extends DCLogic {
  item(o) {
    const m = { offen:['Offen','#1A1A2E','#F7EED4'], ueberfaellig:['Überfällig','#B24343','#F6E4E4'], bewertet:['Bewertet','#1F8A5B','#E3F2EA'] };
    const [t,c,b] = m[o.status];
    return { ...o, status:t, statusStyle:'flex:0 0 auto; display:inline-flex; padding:6px 13px; border-radius:8px; font-size:13px; font-weight:700; color:'+c+'; background:'+b+';' };
  }
  renderVals() {
    return {
      items: [
        this.item({ initials:'SK', name:'Sarah Klein', task:'Rollenspiel 3', course:'Vertriebspsychologie', time:'vor 40 Min.', status:'offen' }),
        this.item({ initials:'MB', name:'Max Böhm', task:'Einwand-Skript', course:'Einwandbehandlung', time:'vor 3 Std.', status:'offen' }),
        this.item({ initials:'LN', name:'Lena Nowak', task:'Gesprächsleitfaden', course:'Terminierung', time:'vor 2 Tagen', status:'ueberfaellig' }),
        this.item({ initials:'TF', name:'Tim Fuchs', task:'Rollenspiel 2', course:'Vertriebspsychologie', time:'vor 3 Tagen', status:'ueberfaellig' }),
        this.item({ initials:'AH', name:'Anna Herz', task:'Bedarfsanalyse-Übung', course:'Bedarfsanalyse', time:'gestern', status:'bewertet' }),
      ],
    };
  }
}
</script>
</body>
</html>
