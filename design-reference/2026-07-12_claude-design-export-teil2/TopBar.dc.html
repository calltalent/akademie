<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="display:flex; align-items:center; gap:18px; padding:20px 40px; background:#F4F5FA; position:sticky; top:0; z-index:20; font-family:'Montserrat',system-ui,sans-serif;">
  <div style="flex:1 1 auto; min-width:0;">
    <div style="font-size:13px; font-weight:600; color:#A9AAC4; letter-spacing:.02em;">{{ breadcrumb }}</div>
    <h1 style="margin:2px 0 0; font-size:26px; font-weight:800; color:#1A1A2E; letter-spacing:-.01em;">{{ title }}</h1>
  </div>

  <div style="position:relative; flex:0 0 auto;">
    <button onClick="{{ toggleNotif }}" style="width:46px; height:46px; border-radius:12px; border:1px solid #E7E8F2; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3E3F66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position:absolute; top:8px; right:8px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#5663AE; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">3</span>
    </button>
    <sc-if value="{{ notifOpen }}" hint-placeholder-val="">
      <div style="position:absolute; top:56px; right:0; width:360px; background:#fff; border:1px solid #E7E8F2; border-radius:16px; box-shadow:0 18px 44px rgba(26,26,46,.16); overflow:hidden; z-index:30;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px;">
          <div style="font-weight:700; font-size:16px;">Benachrichtigungen</div>
          <a href="#" style="font-size:13px; font-weight:600; color:#5663AE; text-decoration:none;">Alle gelesen</a>
        </div>
        <div style="display:flex; gap:6px; padding:0 18px 12px; border-bottom:1px solid #EEF0F7;">
          <span style="font-size:14px; font-weight:700; color:#5663AE; border-bottom:2px solid #5663AE; padding-bottom:8px;">Ungelesen</span>
          <span style="font-size:14px; font-weight:500; color:#A9AAC4; padding:0 8px 8px;">Gelesen</span>
        </div>
        <div style="max-height:320px; overflow:auto;">
          <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="3">
            <div style="display:flex; gap:13px; padding:14px 18px; border-bottom:1px solid #F2F3F9;">
              <span style="flex:0 0 auto; width:36px; height:36px; border-radius:10px; background:#EEF0FA; display:flex; align-items:center; justify-content:center;">
                <span style="width:15px; height:15px; border-radius:4px; background:#5663AE;"></span>
              </span>
              <div style="flex:1 1 auto; min-width:0;">
                <div style="font-size:14px; font-weight:500; line-height:1.45; color:#1A1A2E;">{{ n.text }}</div>
                <div style="font-size:12px; color:#A9AAC4; margin-top:3px;">{{ n.time }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="position:relative; flex:0 0 auto;">
    <button onClick="{{ toggleProfile }}" style="display:flex; align-items:center; gap:11px; padding:5px 12px 5px 5px; border-radius:12px; border:1px solid #E7E8F2; background:#fff; cursor:pointer; font-family:inherit;">
      <span style="width:36px; height:36px; border-radius:9px; background:#3E3F66; color:#F7EED4; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;">JW</span>
      <span style="text-align:left; line-height:1.2;">
        <span style="display:block; font-size:14px; font-weight:600; color:#1A1A2E;">Jonas Weber</span>
        <span style="display:block; font-size:12px; color:#A9AAC4;">Kursteilnehmer</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#66679B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <sc-if value="{{ profileOpen }}" hint-placeholder-val="">
      <div style="position:absolute; top:56px; right:0; width:250px; background:#fff; border:1px solid #E7E8F2; border-radius:16px; box-shadow:0 18px 44px rgba(26,26,46,.16); overflow:hidden; z-index:30; padding:8px;">
        <div style="padding:12px 12px 14px;">
          <div style="font-size:15px; font-weight:700;">Jonas Weber</div>
          <div style="font-size:13px; color:#A9AAC4;">jonas.weber@email.de</div>
        </div>
        <sc-for list="{{ profileItems }}" as="p" hint-placeholder-count="4">
          <a href="{{ p.href }}" style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:500; color:#3E3F66; text-decoration:none;">
            <span style="width:8px; height:8px; border-radius:2px; background:#5663AE;"></span>{{ p.label }}
          </a>
        </sc-for>
        <div style="height:1px; background:#EEF0F7; margin:6px 4px;"></div>
        <a href="Login.dc.html" style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:600; color:#B24343; text-decoration:none;">
          <span style="width:8px; height:8px; border-radius:2px; background:#B24343;"></span>Abmelden
        </a>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;breadcrumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lernen · Meine Kurse&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Willkommen zurück, Jonas&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { notifOpen: false, profileOpen: false };
  toggleNotif = () => this.setState(s => ({ notifOpen: !s.notifOpen, profileOpen: false }));
  toggleProfile = () => this.setState(s => ({ profileOpen: !s.profileOpen, notifOpen: false }));
  renderVals() {
    return {
      breadcrumb: this.props.breadcrumb ?? 'Lernen · Meine Kurse',
      title: this.props.title ?? 'Willkommen zurück, Jonas',
      notifOpen: this.state.notifOpen,
      profileOpen: this.state.profileOpen,
      toggleNotif: this.toggleNotif,
      toggleProfile: this.toggleProfile,
      notifications: [
        { text: 'Neue Lektion in „Einwandbehandlung am Telefon" verfügbar.', time: 'vor 2 Std.' },
        { text: 'Dein Feedback zur Abgabe „Rollenspiel 3" ist da.', time: 'vor 5 Std.' },
        { text: 'Live-Q&A mit dem Coach startet morgen um 18:00 Uhr.', time: 'gestern' },
      ],
      profileItems: [
        { label: 'Profil ansehen', href: 'Einstellungen.dc.html' },
        { label: 'Benachrichtigungen', href: 'Einstellungen.dc.html' },
        { label: 'Sprache: Deutsch', href: '#' },
        { label: 'App installieren', href: '#' },
      ],
    };
  }
}
</script>
</body>
</html>
